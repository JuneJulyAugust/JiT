<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 245" role="img" aria-labelledby="title"><title id="title">The five-layer time-conditioned network</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245d9b"/></marker></defs><rect width="1100" height="245" fill="white"/><g font-family="Arial, sans-serif"><text x="550" y="30" font-size="17" text-anchor="middle" fill="#243447">One network. Five Linear layers. Output meaning selected outside the network.</text><rect x="20" y="70" width="130" height="102" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="85.0" y="104.0" font-size="17" text-anchor="middle" fill="#243447">Noisy input z</text><text x="85.0" y="127.0" font-size="17" text-anchor="middle" fill="#243447">and time t</text><text x="85.0" y="150.0" font-size="17" text-anchor="middle" fill="#243447">D + 1 values</text><path d="M 150 121 L 168 121" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="168" y="70" width="130" height="102" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="233.0" y="104.0" font-size="17" text-anchor="middle" fill="#243447">Linear 1</text><text x="233.0" y="127.0" font-size="17" text-anchor="middle" fill="#243447">D + 1 → 256</text><text x="233.0" y="150.0" font-size="17" text-anchor="middle" fill="#243447">ReLU</text><path d="M 298 121 L 316 121" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="316" y="70" width="130" height="102" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="381.0" y="104.0" font-size="17" text-anchor="middle" fill="#243447">Linear 2</text><text x="381.0" y="127.0" font-size="17" text-anchor="middle" fill="#243447">256 → 256</text><text x="381.0" y="150.0" font-size="17" text-anchor="middle" fill="#243447">ReLU</text><path d="M 446 121 L 464 121" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="464" y="70" width="130" height="102" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="529.0" y="104.0" font-size="17" text-anchor="middle" fill="#243447">Linear 3</text><text x="529.0" y="127.0" font-size="17" text-anchor="middle" fill="#243447">256 → 256</text><text x="529.0" y="150.0" font-size="17" text-anchor="middle" fill="#243447">ReLU</text><path d="M 594 121 L 612 121" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="612" y="70" width="130" height="102" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="677.0" y="104.0" font-size="17" text-anchor="middle" fill="#243447">Linear 4</text><text x="677.0" y="127.0" font-size="17" text-anchor="middle" fill="#243447">256 → 256</text><text x="677.0" y="150.0" font-size="17" text-anchor="middle" fill="#243447">ReLU</text><path d="M 742 121 L 760 121" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="760" y="70" width="130" height="102" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="825.0" y="104.0" font-size="17" text-anchor="middle" fill="#243447">Linear 5</text><text x="825.0" y="127.0" font-size="17" text-anchor="middle" fill="#243447">256 → D</text><text x="825.0" y="150.0" font-size="17" text-anchor="middle" fill="#243447">No activation</text><path d="M 890 121 L 908 121" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="908" y="70" width="130" height="102" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="973.0" y="104.0" font-size="17" text-anchor="middle" fill="#243447">Raw output</text><text x="973.0" y="127.0" font-size="17" text-anchor="middle" fill="#243447">D values</text><text x="973.0" y="150.0" font-size="17" text-anchor="middle" fill="#243447">x̂, ε̂, or v̂</text><text x="550" y="210" font-size="17" text-anchor="middle" fill="#243447">The model receives no projection matrix and no clean point. There is no input-to-output bypass.</text></g></svg>
