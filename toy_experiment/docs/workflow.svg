<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title"><title id="title">Training updates weights, while generation updates the sample state</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#245d9b"/></marker></defs><rect width="1100" height="470" fill="white"/><g font-family="Arial, sans-serif"><text x="550" y="28" font-size="17" text-anchor="middle" fill="#243447">Training: compare velocity predictions with a known pair</text><text x="550" y="258" font-size="17" text-anchor="middle" fill="#243447">Generation: advance a state with the learned velocity</text><rect x="20" y="65" width="190" height="80" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="115.0" y="99.5" font-size="17" text-anchor="middle" fill="#243447">Clean batch x</text><text x="115.0" y="122.5" font-size="17" text-anchor="middle" fill="#243447">time t, noise ε</text><path d="M 210 105 L 235 105" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="235" y="65" width="190" height="80" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="330.0" y="99.5" font-size="17" text-anchor="middle" fill="#243447">Construct z</text><text x="330.0" y="122.5" font-size="17" text-anchor="middle" fill="#243447">target v = x − ε</text><path d="M 425 105 L 450 105" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="450" y="65" width="190" height="80" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="545.0" y="99.5" font-size="17" text-anchor="middle" fill="#243447">Model(z, t)</text><text x="545.0" y="122.5" font-size="17" text-anchor="middle" fill="#243447">raw prediction</text><path d="M 640 105 L 665 105" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="665" y="65" width="190" height="80" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="760.0" y="99.5" font-size="17" text-anchor="middle" fill="#243447">Convert to v̂</text><text x="760.0" y="122.5" font-size="17" text-anchor="middle" fill="#243447">compare with v</text><path d="M 855 105 L 880 105" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="880" y="65" width="190" height="80" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="975.0" y="99.5" font-size="17" text-anchor="middle" fill="#243447">Backward</text><text x="975.0" y="122.5" font-size="17" text-anchor="middle" fill="#243447">optimizer step</text><rect x="20" y="295" width="190" height="80" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="115.0" y="329.5" font-size="17" text-anchor="middle" fill="#243447">Gaussian state</text><text x="115.0" y="352.5" font-size="17" text-anchor="middle" fill="#243447">start at t = δ</text><path d="M 210 335 L 235 335" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="235" y="295" width="190" height="80" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="330.0" y="329.5" font-size="17" text-anchor="middle" fill="#243447">Model(z, t)</text><text x="330.0" y="352.5" font-size="17" text-anchor="middle" fill="#243447">same weights</text><path d="M 425 335 L 450 335" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="450" y="295" width="190" height="80" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="545.0" y="329.5" font-size="17" text-anchor="middle" fill="#243447">Convert to v̂</text><text x="545.0" y="352.5" font-size="17" text-anchor="middle" fill="#243447">same formula</text><path d="M 640 335 L 665 335" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="665" y="295" width="190" height="80" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="760.0" y="329.5" font-size="17" text-anchor="middle" fill="#243447">Euler or Heun</text><text x="760.0" y="352.5" font-size="17" text-anchor="middle" fill="#243447">advance z and t</text><path d="M 855 335 L 880 335" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="880" y="295" width="190" height="80" rx="8" fill="#eef4fa" stroke="#245d9b"/><text x="975.0" y="329.5" font-size="17" text-anchor="middle" fill="#243447">Final samples</text><text x="975.0" y="352.5" font-size="17" text-anchor="middle" fill="#243447">then evaluate</text><path d="M 975 145 V 188 H 545 V 145" stroke="#a94f13" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/><text x="760" y="216" font-size="16" text-anchor="middle" fill="#a94f13">Updated weights. Start each new update at the left.</text><path d="M 760 375 V 411 H 330 V 375" stroke="#245d9b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="550" y="443" font-size="16" text-anchor="middle" fill="#243447">Repeat until t = 1 − δ. No fresh noise or weight update inside this loop.</text></g></svg>
